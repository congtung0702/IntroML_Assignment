[project]
name = "introml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "songshu", email = "congtung0702@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
introml = "introml:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
